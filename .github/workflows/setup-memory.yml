name: Set up memory search (one time)
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create the Vectorize index for Command's memory (safe to run again)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 vectorize create sf-memory --dimensions=768 --metric=cosine 2>&1 | tee out.txt || true
          grep -qi "already exists\|Successfully created\|created index" out.txt && echo "MEMORY INDEX READY" || (echo "Could not create the index. If it says Authentication or permission, the Cloudflare API token needs Vectorize: Edit."; exit 1)
